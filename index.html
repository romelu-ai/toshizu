<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語動詞文型クイズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0f14;color:#e8e6df;font-family:Arial,sans-serif;min-height:100vh;padding:0 0 40px}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:24px;color:#e8c97a;text-align:center;padding:18px 0 4px}
.sub{text-align:center;font-size:11px;color:#666;letter-spacing:.1em;margin-bottom:12px}

/* NAV TABS */
#navtabs{display:flex;gap:0;border-bottom:1px solid #2a2c38;margin-bottom:16px}
.ntb{flex:1;padding:10px 6px;background:none;border:none;color:#666;font-size:12px;font-family:Arial,sans-serif;cursor:pointer;letter-spacing:.05em;border-bottom:2px solid transparent;transition:all .2s}
.ntb.act{color:#e8c97a;border-bottom-color:#e8c97a}
.ntb:hover:not(.act){color:#aaa}

#pb{height:4px;background:#2a2c38;border-radius:2px;margin-bottom:16px}
#pbi{height:4px;background:#e8c97a;border-radius:2px;width:0;transition:width .3s}

/* PAGE VISIBILITY */
.page{display:none}
.page.show{display:block}

/* ===== SETUP ===== */
#setup{text-align:center;padding:10px 0 24px}
#setup h2{font-size:17px;color:#e8c97a;margin-bottom:16px}
.sl{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
#cw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.cb{padding:6px 16px;border-radius:20px;border:1px solid #333;background:none;color:#666;font-size:13px;cursor:pointer;font-family:Arial,sans-serif;transition:all .2s}
.cb.on{border-color:#e8c97a;color:#e8c97a;background:rgba(232,201,122,.08)}
.cr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
#qcnt{padding:7px 10px;background:#16181f;border:1px solid #333;border-radius:8px;color:#e8e6df;font-size:13px}
#sb{padding:13px 40px;background:#e8c97a;color:#0e0f14;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif}
#sb:hover{background:#f5d882}

/* ===== STATS BAR ===== */
#st{display:flex;gap:14px;justify-content:center;padding:10px;background:#16181f;border:1px solid #2a2c38;border-radius:10px;margin-bottom:14px}
.si{display:flex;flex-direction:column;align-items:center;gap:2px}
.sv{font-size:20px;font-weight:700}.sl2{font-size:10px;color:#666}
.gc{color:#5dd68c}.rw{color:#e87a7a}.yn{color:#e8c97a}

/* ===== CARD ===== */
#qc2{background:#1e2029;border:1px solid #2a2c38;border-radius:16px;padding:22px 26px 18px;margin-bottom:12px;position:relative;overflow:hidden}
#qc2:before{content:’’;position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e8c97a,#7ab8e8)}
.ct{display:flex;align-items:flex-end;gap:12px;margin-bottom:8px;flex-wrap:wrap}
#qv{font-size:44px;color:#e8c97a;font-weight:700;line-height:1}
#qn{font-size:11px;color:#666;padding-bottom:6px}
.bg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.bx{font-size:11px;color:#666;border:1px solid #2a2c38;border-radius:14px;padding:3px 10px}
.b1{border-color:rgba(232,201,122,.3);color:#e8c97a}
.b2{border-color:rgba(122,184,232,.3);color:#7ab8e8}
.pt{font-size:13px;color:#a0a0a0}

/* ===== OPTIONS ===== */
#og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ob{padding:12px 14px;background:#16181f;border:1px solid #2a2c38;border-radius:10px;color:#e8e6df;font-family:‘Courier New’,monospace;font-size:13px;cursor:pointer;text-align:left;line-height:1.5;width:100%;transition:all .15s}
.ob:hover:not(:disabled){border-color:#e8c97a;background:#1a1c28}
.bok{background:rgba(93,214,140,.12)!important;border-color:#5dd68c!important;color:#5dd68c!important}
.bng{background:rgba(232,122,122,.10)!important;border-color:#e87a7a!important;color:#e87a7a!important}

/* ===== FEEDBACK ===== */
#fb{display:none;border-radius:10px;padding:14px 16px;margin-bottom:12px;line-height:1.6}
#fb.ok{background:rgba(93,214,140,.10);border:1px solid rgba(93,214,140,.3)}
#fb.ng{background:rgba(232,122,122,.10);border:1px solid rgba(232,122,122,.3)}
#fbh{font-size:14px;font-weight:700;margin-bottom:7px}
.ok #fbh{color:#5dd68c}.ng #fbh{color:#e87a7a}
#fbf{font-family:‘Courier New’,monospace;font-size:14px;color:#e8c97a;padding:6px 10px;background:rgba(232,201,122,.07);border-radius:5px;margin-bottom:8px;display:block}
.fr{font-size:12px;color:#c8c6c0;margin-bottom:3px}
.fr b{color:#7ab8e8;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
#fe{margin-top:8px;padding:8px 12px;background:rgba(122,184,232,.08);border-left:3px solid #7ab8e8;border-radius:0 6px 6px 0}
#fel{font-size:10px;color:#7ab8e8;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:4px}
#fee{font-family:‘Courier New’,monospace;font-size:12px;color:#c8e4f5}
#fej{font-size:12px;color:#90a8b8;margin-top:3px}

/* ===== NEXT BTN ===== */
#nb{display:none;width:100%;padding:13px;background:#e8c97a;color:#0e0f14;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px;font-family:Arial,sans-serif}
#nb:hover{background:#f5d882}

/* ===== RESULT ===== */
#rs{text-align:center;padding:32px 0}
#rp{font-size:64px;font-weight:700;color:#e8c97a;line-height:1;margin:12px 0 5px}
#rl{font-size:15px;margin-bottom:8px}
.rr{display:flex;gap:22px;justify-content:center;margin:12px 0 20px}
.rd{text-align:center}
.rdv{font-size:24px;font-weight:700}.rdl{font-size:10px;color:#666}
#rm{font-size:13px;color:#888;margin-bottom:24px;line-height:1.8}
.rb{padding:11px 28px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin:0 4px;font-family:Arial,sans-serif}
#r1{background:#e8c97a;color:#0e0f14;border:none}
#r2{background:none;color:#e8c97a;border:1px solid #e8c97a}
#r3{background:none;color:#e87a7a;border:1px solid #e87a7a;margin-top:10px}
#r3:disabled{opacity:.35;cursor:not-allowed}

/* ===== LIST VIEW ===== */
#listpage{padding-bottom:20px}
.lf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.lf select,.lf input{padding:7px 10px;background:#16181f;border:1px solid #333;border-radius:8px;color:#e8e6df;font-size:13px;font-family:Arial,sans-serif}
.lf input{flex:1;min-width:120px}
.lf input::placeholder{color:#555}
.ltb{width:100%;border-collapse:collapse;font-size:12px}
.ltb th{background:#16181f;color:#7ab8e8;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid #2a2c38;text-align:left;position:sticky;top:0;z-index:1}
.ltb td{padding:8px 10px;border-bottom:1px solid #1e2029;vertical-align:top;line-height:1.5}
.ltb tr:hover td{background:#16181f}
.lv{font-size:15px;font-weight:700;color:#e8c97a;font-family:‘Courier New’,monospace}
.lcf{font-family:‘Courier New’,monospace;color:#c8e4f5;font-size:12px}
.lm{color:#a0a0a0;font-size:11px}
.lul{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid #2a2c38;color:#666;white-space:nowrap}
.ltb-wrap{max-height:600px;overflow-y:auto;border:1px solid #2a2c38;border-radius:10px}
.lcount{font-size:11px;color:#666;margin-bottom:8px}
.tb1{border-color:rgba(232,201,122,.3);color:#e8c97a}
.tb2{border-color:rgba(122,184,232,.3);color:#7ab8e8}
.tb3{border-color:rgba(93,214,140,.3);color:#5dd68c}

/* ===== REVIEW PAGE ===== */
#reviewpage{padding-bottom:20px}
.rvempty{text-align:center;padding:40px 20px;color:#555;font-size:14px}
.rvempty span{font-size:32px;display:block;margin-bottom:10px}
.rvsummary{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.rvsummary span{font-size:13px;color:#888}
.rvsummary em{color:#e87a7a;font-style:normal;font-weight:700}
.rvbtns{display:flex;gap:8px}
.rvbtn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;border:none}
#rv-start{background:#e87a7a;color:#0e0f14}
#rv-clear{background:none;color:#e87a7a;border:1px solid #e87a7a;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif}
.rvcard{background:#1e2029;border:1px solid #2a2c38;border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative}
.rvcard:before{content:’’;position:absolute;top:0;left:0;bottom:0;width:3px;background:#e87a7a;border-radius:3px 0 0 3px}
.rvc-v{font-size:22px;font-weight:700;color:#e8c97a;font-family:‘Courier New’,monospace;margin-bottom:4px}
.rvc-cf{font-family:‘Courier New’,monospace;font-size:13px;color:#c8e4f5;margin-bottom:4px}
.rvc-m{font-size:12px;color:#a0a0a0;margin-bottom:6px}
.rvc-ex{font-size:11px;color:#7ab8e8;font-family:‘Courier New’,monospace;padding:5px 8px;background:rgba(122,184,232,.06);border-radius:4px}
.rvc-exj{font-size:11px;color:#90a8b8;margin-top:2px}
.rvc-del{position:absolute;top:10px;right:12px;background:none;border:none;color:#444;cursor:pointer;font-size:16px;padding:2px 6px}
.rvc-del:hover{color:#e87a7a}

/* REVIEW QUIZ mode (reuse quiz styles) */
#rvq-area{}

@media(max-width:480px){
#og{grid-template-columns:1fr}
#qv{font-size:34px}
#qc2{padding:16px 14px}
.ltb th:nth-child(4),.ltb td:nth-child(4){display:none}
.ltb th:nth-child(5),.ltb td:nth-child(5){display:none}
}
</style>

</head>
<body>
<div id="app">
  <h1>Verb Pattern Quiz</h1>
  <div class="sub">英語動詞文型マスター</div>

  <!-- NAV -->

  <div id="navtabs">
    <button class="ntb act" onclick="showPage('quiz')">📝 クイズ</button>
    <button class="ntb" onclick="showPage('list')">📋 一覧表</button>
    <button class="ntb" onclick="showPage('review')">❌ 復習 <span id="rv-badge"></span></button>
  </div>

  <div id="pb"><div id="pbi"></div></div>

  <!-- ===== QUIZ PAGE ===== -->

  <div id="quiz" class="page show">

<!-- SETUP -->
<div id="setup">
  <h2>出題設定</h2>
  <div class="sl">カテゴリー選択</div>
  <div id="cw"></div>
  <div class="sl">出題数</div>
  <div class="cr">
    <select id="qcnt">
      <option value="10">10問</option>
      <option value="20" selected>20問</option>
      <option value="30">30問</option>
      <option value="all">全問</option>
    </select>
  </div>
  <button id="sb" onclick="startQuiz()">スタート</button>
</div>

<!-- QUIZ AREA -->
<div id="qarea" style="display:none">
  <div id="st">
    <div class="si"><span class="sv yn" id="s0">0</span><span class="sl2">問目</span></div>
    <div class="si"><span class="sv gc" id="s1">0</span><span class="sl2">正解</span></div>
    <div class="si"><span class="sv rw" id="s2">0</span><span class="sl2">不正解</span></div>
    <div class="si"><span class="sv yn" id="s3">-</span><span class="sl2">正答率</span></div>
  </div>
  <div id="qc2">
    <div class="ct"><div id="qv">-</div><div id="qn">1/1</div></div>
    <div class="bg"><span class="bx b1" id="bt">-</span><span class="bx b2" id="bu">-</span></div>
    <div class="pt">正しい用法構文を選んでください</div>
  </div>
  <div id="og"></div>
  <div id="fb">
    <div id="fbh"></div>
    <span id="fbf"></span>
    <div id="fbr"></div>
    <div id="fe"><div id="fel">例文</div><div id="fee"></div><div id="fej"></div></div>
  </div>
  <button id="nb" onclick="nextQ()">次の問題</button>
</div>

<!-- RESULT -->
<div id="rs" style="display:none">
  <div style="font-size:40px">🎓</div>
  <div id="rp">-</div><div id="rl">お疲れ様でした</div>
  <div class="rr">
    <div class="rd"><div class="rdv gc" id="rc">0</div><div class="rdl">正解</div></div>
    <div class="rd"><div class="rdv rw" id="rw2">0</div><div class="rdl">不正解</div></div>
    <div class="rd"><div class="rdv yn" id="rt">0</div><div class="rdl">総問数</div></div>
  </div>
  <div id="rm"></div>
  <div>
    <button class="rb" id="r1" onclick="startQuiz()">もう一度</button>
    <button class="rb" id="r2" onclick="goSetup()">設定に戻る</button>
  </div>
  <div style="margin-top:10px">
    <button class="rb" id="r3" onclick="goReviewFromResult()">❌ 間違いを復習する</button>
  </div>
</div>

  </div><!-- /quiz page -->

  <!-- ===== LIST PAGE ===== -->

  <div id="listpage" class="page">
    <div class="lf">
      <select id="lf-tb" onchange="renderList()">
        <option value="">全カテゴリー</option>
        <option value="1">動詞表1 (S+V+O1+O2)</option>
        <option value="2">動詞表2 (S+V+C)</option>
        <option value="3">動詞表3 (S+V+O+C)</option>
      </select>
      <select id="lf-ul" onchange="renderList()">
        <option value="">全用法</option>
      </select>
      <input id="lf-q" type="text" placeholder="動詞で絞り込み…" oninput="renderList()">
    </div>
    <div class="lcount" id="lcount"></div>
    <div class="ltb-wrap">
      <table class="ltb">
        <thead>
          <tr>
            <th>動詞</th>
            <th>正しい構文</th>
            <th>意味 / 例文</th>
            <th>用法</th>
            <th>表</th>
          </tr>
        </thead>
        <tbody id="ltbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== REVIEW PAGE ===== -->

  <div id="reviewpage" class="page">
    <div id="rv-list-area"></div>
    <div id="rvq-area" style="display:none">
      <!-- reuses quiz-style markup dynamically -->
    </div>
  </div>

</div><!-- /app -->

<script>

var tbName={"1":"動詞表1","2":"動詞表2","3":"動詞表3"};
var selTb={"1":true,"2":true,"3":true};

// --- Wrong answer store (sessionStorage-based) ---
var wrongKeys=[];
try{var wk=sessionStorage.getItem('vpq_wrong');if(wk)wrongKeys=JSON.parse(wk);}catch(e){}
function saveWrong(){try{sessionStorage.setItem('vpq_wrong',JSON.stringify(wrongKeys));}catch(e){}}
function addWrong(v,cf){
  var key=v+'|||'+cf;
  if(wrongKeys.indexOf(key)<0){wrongKeys.push(key);saveWrong();}
  updateBadge();
}
function removeWrong(v,cf){
  var key=v+'|||'+cf;
  wrongKeys=wrongKeys.filter(function(k){return k!==key;});
  saveWrong();updateBadge();
}
function getWrongItems(){
  return wrongKeys.map(function(k){
    var parts=k.split('|||');
    return DATA.find(function(d){return d.v===parts[0]&&d.cf===parts[1];})||null;
  }).filter(Boolean);
}
function clearAllWrong(){wrongKeys=[];saveWrong();updateBadge();}
function updateBadge(){
  var b=document.getElementById('rv-badge');
  if(b)b.textContent=wrongKeys.length>0?'('+wrongKeys.length+')':'';
}

var curPage='quiz';
function showPage(p){
  curPage=p;
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('show');});
  document.querySelectorAll('.ntb').forEach(function(el){el.classList.remove('act');});
  var pages={quiz:'quiz',list:'listpage',review:'reviewpage'};
  document.getElementById(pages[p]).classList.add('show');
  var idx={quiz:0,list:1,review:2}[p];
  document.querySelectorAll('.ntb')[idx].classList.add('act');
  document.getElementById('pb').style.display=p==='quiz'?'block':'none';
  if(p==='list')renderList();
  if(p==='review')renderReviewList();
}

// --- Category buttons ---
(function buildCats(){
  var wrap=document.getElementById('cw');
  ['1','2','3'].forEach(function(tb){
    var btn=document.createElement('button');
    btn.className='cb on';btn.textContent=tbName[tb];
    btn.onclick=function(){
      if(selTb[tb]){var n=0;for(var k in selTb){if(selTb[k])n++;}if(n<=1)return;selTb[tb]=false;btn.className='cb';}
      else{selTb[tb]=true;btn.className='cb on';}
    };
    wrap.appendChild(btn);
  });
})();

// --- Build ul filter for list ---
(function buildUlFilter(){
  var uls={},sel=document.getElementById('lf-ul');
  DATA.forEach(function(d){uls[d.ul]=1;});

// ===== QUIZ LOGIC =====
var qList=[],qIdx=0,cor=0,wrg=0,answerDone=false;
var sessionWrong=[]; // wrong items in current quiz session

function g(id){return document.getElementById(id);}
function t(id,s){g(id).textContent=s;}

function shuffle(a){
  var b=a.slice(),i,j,x;
  for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=b[i];b[i]=b[j];b[j]=x;}
  return b;
}

function startQuiz(pool){
  sessionWrong=[];
  if(!pool){
    pool=DATA.filter(function(d){return selTb[d.tb];});
    if(pool.length<4){alert('カテゴリーを選んでください');return;}
    var sel=g('qcnt').value;
    var sh=shuffle(pool);
    var n=sel==='all'?sh.length:Math.min(parseInt(sel),sh.length);
    qList=sh.slice(0,n);
  }else{
    qList=shuffle(pool);
  }
  qIdx=0;cor=0;wrg=0;answerDone=false;
  g('setup').style.display='none';
  g('rs').style.display='none';
  g('rvq-area').style.display='none';
  g('rv-list-area').style.display='';
  g('qarea').style.display='block';
  renderQ();
}

function renderQ(){
  if(qIdx>=qList.length){showResult();return;}
  answerDone=false;
  var q=qList[qIdx];
  var pct=Math.round(qIdx/qList.length*100);
  g('pbi').style.width=pct+'%';
  t('s0',qIdx+1);t('s1',cor);t('s2',wrg);
  t('s3',qIdx===0?'-':Math.round(cor/qIdx*100)+'%');
  t('qv',q.v);t('qn',(qIdx+1)+' / '+qList.length);
  t('bt',tbName[q.tb]);t('bu',q.ug);
  g('fb').style.display='none';g('nb').style.display='none';
  var opts=shuffle([q.cf,q.wf[0],q.wf[1],q.wf[2]]);
  var grid=g('og');grid.innerHTML='';
  opts.forEach(function(opt){
    var btn=document.createElement('button');
    btn.className='ob';btn.textContent=opt;
    btn.onclick=function(){doAns(btn,opt,q);};
    grid.appendChild(btn);
  });
}

function doAns(btn,chosen,q){
  if(answerDone)return;answerDone=true;
  var ok=chosen===q.cf;
  if(ok)cor++;else{wrg++;addWrong(q.v,q.cf);sessionWrong.push(q);}
  var all=g('og').getElementsByTagName('button');
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===q.cf)all[i].className='ob bok';
  }
  if(!ok)btn.className='ob bng';
  t('s1',cor);t('s2',wrg);t('s3',Math.round(cor/(qIdx+1)*100)+'%');
  var fb=g('fb');
  fb.className=ok?'ok':'ng';
  t('fbh',ok?'✓ 正解！':'✗ 不正解');
  t('fbf',q.cf);
  var rows=g('fbr');rows.innerHTML='';
  [['意味',q.m],['用法',q.ul],['文型',q.ug+' (動詞表'+q.tb+')']].forEach(function(r){
    var div=document.createElement('div');div.className='fr';
    var b=document.createElement('b');b.textContent=r[0];
    div.appendChild(b);div.appendChild(document.createTextNode(r[1]));
    rows.appendChild(div);
  });
  t('fee',q.en);t('fej',q.ja);
  g('fb').style.display='block';g('nb').style.display='block';
}

function nextQ(){qIdx++;renderQ();}

function showResult(){
  g('qarea').style.display='none';
  g('pbi').style.width='100%';
  var tot=qList.length,pct=Math.round(cor/tot*100);
  t('rp',pct+'%');t('rl',tot+'問中 '+cor+'問正解');
  t('rc',cor);t('rw2',wrg);t('rt',tot);
  var msgs=['基礎から整理しましょう。カテゴリーを絞って繰り返すのが効果的です。',
    '半分以上正解！用法パターンの細部を意識して復習しましょう。',
    'よくできました！to/forの区別やto beの有無などを確認しましょう。',
    'ほぼ完璧！自信を持ってください。'];
  t('rm',msgs[pct>=90?3:pct>=75?2:pct>=55?1:0]);
  var r3=g('r3');
  r3.disabled=sessionWrong.length===0;
  r3.textContent='❌ 間違い '+sessionWrong.length+'問を復習する';
  g('rs').style.display='block';
}

function goSetup(){g('rs').style.display='none';g('setup').style.display='block';}

function goReviewFromResult(){
  if(sessionWrong.length===0)return;
  showPage('review');
  startReviewQuiz(sessionWrong);
}

  var tbF=document.getElementById('lf-tb').value;
  var ulF=document.getElementById('lf-ul').value;
  var qF=(document.getElementById('lf-q').value||'').toLowerCase().trim();
  var rows=DATA.filter(function(d){
    if(tbF&&d.tb!==tbF)return false;
    if(ulF&&d.ul!==ulF)return false;
    if(qF&&d.v.toLowerCase().indexOf(qF)<0)return false;
    return true;
  });
  document.getElementById('lcount').textContent=rows.length+'件';
  var tb=document.getElementById('ltbody');tb.innerHTML='';
  rows.forEach(function(d){
    var tr=document.createElement('tr');
    var tbCls='tb'+d.tb;
    tr.innerHTML='<td><span class="lv">'+d.v+'</span></td>'
      +'<td><span class="lcf">'+d.cf+'</span></td>'
      +'<td><span class="lm">'+d.m+'</span><br><span class="lcf" style="font-size:11px;color:#7ab8e8">'+d.en+'</span><br><span class="lm" style="font-size:10px">'+d.ja+'</span></td>'
      +'<td><span class="lul '+tbCls+'">'+d.ul+'</span></td>'
      +'<td><span class="lul '+tbCls+'">'+tbName[d.tb]+'</span></td>';
    tb.appendChild(tr);
  });
}

// ===== REVIEW LIST =====
function renderReviewList(){
  g('rvq-area').style.display='none';
  g('rv-list-area').style.display='';
  var items=getWrongItems();
  var area=g('rv-list-area');
  if(items.length===0){
    area.innerHTML='<div class="rvempty"><span>✅</span>間違えた問題はありません！<br><span style="font-size:12px;color:#555;margin-top:8px;display:block">クイズで間違えると自動的にここに追加されます</span></div>';
    return;
  }
  var html='<div class="rvsummary"><span>間違えた問題 <em>'+items.length+'件</em></span>'
    +'<div class="rvbtns"><button id="rv-start" class="rvbtn" onclick="startReviewQuiz(getWrongItems())">🔄 まとめてクイズ</button>'
    +'<button id="rv-clear" onclick="if(confirm(\'全て削除しますか？\')){clearAllWrong();renderReviewList();}">🗑 全削除</button></div></div>';
  items.forEach(function(d){
    var key=d.v+'|||'+d.cf;
    html+='<div class="rvcard" id="rvc-'+encodeURIComponent(key)+'">'
      +'<button class="rvc-del" onclick="removeWrong(\''+d.v.replace(/'/g,"\\'")+"','"+(d.cf.replace(/'/g,"\\'")+'\');renderReviewList();">×</button>')
      +'<div class="rvc-v">'+d.v+'</div>'
      +'<div class="rvc-cf">'+d.cf+'</div>'
      +'<div class="rvc-m">'+d.m+' ／ '+d.ul+' ／ '+tbName[d.tb]+'</div>'
      +'<div class="rvc-ex">'+d.en+'</div>'
      +'<div class="rvc-exj">'+d.ja+'</div>'
      +'</div>';
  });
  area.innerHTML=html;
}

// ===== REVIEW QUIZ =====
var rvList=[],rvIdx=0,rvCor=0,rvWrg=0,rvDone=false;

function startReviewQuiz(items){
  if(!items||items.length===0)return;
  // Need at least 4 items total for options; pad with random others if needed
  var pool=items.slice();
  if(pool.length<4){
    var extra=shuffle(DATA.filter(function(d){return items.indexOf(d)<0;}));
    pool=pool.concat(extra.slice(0,4-pool.length));
  }
  rvList=shuffle(items); // only quiz on wrong items, use pool for distractors
  rvIdx=0;rvCor=0;rvWrg=0;rvDone=false;
  g('rv-list-area').style.display='none';
  var area=g('rvq-area');
  area.style.display='block';
  area.innerHTML=buildRvHtml();
  renderRvQ();
}

function buildRvHtml(){
  return '<div id="rvst" style="display:flex;gap:14px;justify-content:center;padding:10px;background:#16181f;border:1px solid #2a2c38;border-radius:10px;margin-bottom:14px">'
    +'<div class="si"><span class="sv yn" id="rvs0">0</span><span class="sl2">問目</span></div>'
    +'<div class="si"><span class="sv gc" id="rvs1">0</span><span class="sl2">正解</span></div>'
    +'<div class="si"><span class="sv rw" id="rvs2">0</span><span class="sl2">不正解</span></div>'
    +'<div class="si"><span class="sv yn" id="rvs3">-</span><span class="sl2">正答率</span></div>'
    +'</div>'
    +'<div id="rvqc" style="background:#1e2029;border:1px solid #2a2c38;border-radius:16px;padding:22px 26px 18px;margin-bottom:12px;position:relative;overflow:hidden">'
    +'<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e87a7a,#e8c97a)"></div>'
    +'<div class="ct"><div id="rvqv" style="font-size:44px;color:#e8c97a;font-weight:700">-</div><div id="rvqn" style="font-size:11px;color:#666;padding-bottom:6px">1/1</div></div>'
    +'<div class="bg"><span class="bx b1" id="rvbt">-</span><span class="bx b2" id="rvbu">-</span></div>'
    +'<div class="pt">正しい用法構文を選んでください</div>'
    +'</div>'
    +'<div id="rvog" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px"></div>'
    +'<div id="rvfb" style="display:none;border-radius:10px;padding:14px 16px;margin-bottom:12px;line-height:1.6">'
    +'<div id="rvfbh" style="font-size:14px;font-weight:700;margin-bottom:7px"></div>'
    +'<span id="rvfbf" style="font-family:\'Courier New\',monospace;font-size:14px;color:#e8c97a;padding:6px 10px;background:rgba(232,201,122,.07);border-radius:5px;margin-bottom:8px;display:block"></span>'
    +'<div id="rvfbr"></div>'
    +'<div style="margin-top:8px;padding:8px 12px;background:rgba(122,184,232,.08);border-left:3px solid #7ab8e8;border-radius:0 6px 6px 0">'
    +'<div style="font-size:10px;color:#7ab8e8;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:4px">例文</div>'
    +'<div id="rvfee" style="font-family:\'Courier New\',monospace;font-size:12px;color:#c8e4f5"></div>'
    +'<div id="rvfej" style="font-size:12px;color:#90a8b8;margin-top:3px"></div>'
    +'</div></div>'
    +'<button id="rvnb" style="display:none;width:100%;padding:13px;background:#e87a7a;color:#0e0f14;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px;font-family:Arial,sans-serif" onclick="rvNext()">次の問題</button>'
    +'<div id="rvrs" style="display:none;text-align:center;padding:32px 0">'
    +'<div style="font-size:40px">📝</div>'
    +'<div id="rvrp" style="font-size:64px;font-weight:700;color:#e8c97a;line-height:1;margin:12px 0 5px">-</div>'
    +'<div id="rvrl" style="font-size:15px;margin-bottom:16px"></div>'
    +'<button class="rb" style="background:#e87a7a;color:#0e0f14;border:none;padding:11px 28px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin:0 4px;font-family:Arial,sans-serif" onclick="startReviewQuiz(getWrongItems())">もう一度</button>'
    +'<button class="rb" style="background:none;color:#e87a7a;border:1px solid #e87a7a;padding:11px 28px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin:0 4px;font-family:Arial,sans-serif" onclick="g(\'rvq-area\').style.display=\'none\';g(\'rv-list-area\').style.display=\'\';renderReviewList();">リストに戻る</button>'
    +'</div>';
}

function renderRvQ(){
  if(rvIdx>=rvList.length){showRvResult();return;}
  rvDone=false;
  var q=rvList[rvIdx];
  document.getElementById('rvs0').textContent=rvIdx+1;
  document.getElementById('rvs1').textContent=rvCor;
  document.getElementById('rvs2').textContent=rvWrg;
  document.getElementById('rvs3').textContent=rvIdx===0?'-':Math.round(rvCor/rvIdx*100)+'%';
  document.getElementById('rvqv').textContent=q.v;
  document.getElementById('rvqn').textContent=(rvIdx+1)+' / '+rvList.length;
  document.getElementById('rvbt').textContent=tbName[q.tb];
  document.getElementById('rvbu').textContent=q.ug;
  document.getElementById('rvfb').style.display='none';
  document.getElementById('rvnb').style.display='none';
  // distractors: use other items from DATA
  var distractors=shuffle(DATA.filter(function(d){return d.cf!==q.cf;})).slice(0,3).map(function(d){return d.cf;});
  var opts=shuffle([q.cf].concat(distractors));
  var grid=document.getElementById('rvog');grid.innerHTML='';
  opts.forEach(function(opt){
    var btn=document.createElement('button');
    btn.className='ob';btn.textContent=opt;
    btn.onclick=function(){doRvAns(btn,opt,q);};
    grid.appendChild(btn);
  });
}

function doRvAns(btn,chosen,q){
  if(rvDone)return;rvDone=true;
  var ok=chosen===q.cf;
  if(ok){rvCor++;removeWrong(q.v,q.cf);}else rvWrg++;
  var all=document.getElementById('rvog').getElementsByTagName('button');
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===q.cf)all[i].className='ob bok';
  }
  if(!ok)btn.className='ob bng';
  document.getElementById('rvs1').textContent=rvCor;
  document.getElementById('rvs2').textContent=rvWrg;
  document.getElementById('rvs3').textContent=Math.round(rvCor/(rvIdx+1)*100)+'%';
  var fb=document.getElementById('rvfb');
  fb.className=ok?'ok':'ng';
  document.getElementById('rvfbh').textContent=ok?'✓ 正解！（復習完了）':'✗ 不正解';
  document.getElementById('rvfbf').textContent=q.cf;
  var rows=document.getElementById('rvfbr');rows.innerHTML='';
  [['意味',q.m],['用法',q.ul],['文型',q.ug+' (動詞表'+q.tb+')']].forEach(function(r){
    var div=document.createElement('div');div.className='fr';
    var b=document.createElement('b');b.textContent=r[0];
    div.appendChild(b);div.appendChild(document.createTextNode(r[1]));
    rows.appendChild(div);
  });
  document.getElementById('rvfee').textContent=q.en;
  document.getElementById('rvfej').textContent=q.ja;
  fb.style.display='block';
  document.getElementById('rvnb').style.display='block';
}

function rvNext(){rvIdx++;renderRvQ();}

function showRvResult(){
  document.getElementById('rvog').style.display='none';
  document.getElementById('rvfb').style.display='none';
  document.getElementById('rvnb').style.display='none';
  document.getElementById('rvqc').style.display='none';
  document.getElementById('rvst').style.display='none';
  var pct=rvList.length>0?Math.round(rvCor/rvList.length*100):100;
  document.getElementById('rvrp').textContent=pct+'%';
  document.getElementById('rvrl').textContent=rvList.length+'問中 '+rvCor+'問正解';
  document.getElementById('rvrs').style.display='block';
}

// init
updateBadge();
</script>
