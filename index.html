<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語動詞文型クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14; --surface: #16181f; --card: #1e2029;
    --accent: #e8c97a; --accent2: #7ab8e8; --accent3: #c87ae8;
    --correct: #5dd68c; --wrong: #e87a7a;
    --text: #e8e6df; --muted: #7a7d8a; --border: #2e3040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(232,201,122,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,201,122,0.022) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  header { width: 100%; max-width: 820px; padding: 36px 24px 10px; text-align: center; }
  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px,5vw,42px); color: var(--accent); letter-spacing: .03em; margin-bottom: 4px;
  }
  .subtitle { font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

.progress-wrap { width: 100%; max-width: 820px; height: 4px; background: var(–border); margin-top: 14px; }
.progress-fill { height: 100%; background: linear-gradient(90deg,var(–accent),var(–accent2)); transition: width .4s ease; }

main { width: 100%; max-width: 820px; padding: 20px 20px 50px; flex: 1; }

/* ── Setup ── */
#setup-screen { text-align: center; padding: 12px 0 44px; }
#setup-screen h2 { font-family:‘Playfair Display’,serif; font-size:20px; color:var(–accent); margin-bottom:18px; }
.setup-label { font-size:11px; color:var(–muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
.setup-section { margin-bottom:22px; }
.cat-filter { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.cat-tag {
padding:7px 18px; border-radius:20px; border:1px solid var(–border);
background:transparent; color:var(–muted); font-size:12px; cursor:pointer;
font-family:‘Noto Sans JP’,sans-serif; transition:all .15s;
}
.cat-tag.on { border-color:var(–accent); color:var(–accent); background:rgba(232,201,122,.08); }
.q-count-row { display:flex; align-items:center; justify-content:center; gap:12px; }
.q-count-row label { font-size:13px; color:var(–muted); }
.q-count-row select {
padding:8px 12px; background:var(–surface); border:1px solid var(–border);
border-radius:8px; color:var(–text); font-family:‘Noto Sans JP’,sans-serif; font-size:13px; cursor:pointer;
}
.start-btn {
padding:14px 46px; background:var(–accent); color:#0e0f14;
border:none; border-radius:12px; font-family:‘Noto Sans JP’,sans-serif;
font-size:15px; font-weight:700; cursor:pointer; transition:all .2s; margin-top:10px;
}
.start-btn:hover { background:#f0d890; }
.divider { width:36px; height:2px; background:var(–border); border-radius:1px; margin:18px auto; }

/* ── Stats ── */
.stats-bar {
display:flex; gap:20px; justify-content:center;
padding:12px 24px; margin-bottom:18px;
background:var(–surface); border:1px solid var(–border); border-radius:12px;
}
.stat-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
.stat-val { font-size:20px; font-weight:700; font-family:‘Playfair Display’,serif; }
.stat-val.c { color:var(–correct); } .stat-val.w { color:var(–wrong); } .stat-val.n { color:var(–accent); }
.stat-label { color:var(–muted); font-size:10px; letter-spacing:.05em; }

/* ── Question card ── */
.q-card {
background:var(–card); border:1px solid var(–border); border-radius:20px;
padding:28px 36px 26px; margin-bottom:14px;
position:relative; overflow:hidden;
}
.q-card::before {
content:’’; position:absolute; top:0; left:0; right:0; height:3px;
background:linear-gradient(90deg,var(–accent),var(–accent2),var(–accent3));
}
.qc-top { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.qc-verb {
font-family:‘Playfair Display’,serif; font-size:clamp(40px,7vw,60px);
color:var(–accent); line-height:1;
}
.qc-num { font-size:11px; color:var(–muted); letter-spacing:.1em; text-transform:uppercase; padding-bottom:6px; }
.qc-badges { display:flex; gap:8px; flex-wrap:wrap; }
.badge {
display:inline-flex; align-items:center; gap:5px;
padding:3px 11px; border-radius:20px; border:1px solid var(–border);
font-size:11px; color:var(–muted); letter-spacing:.05em;
}
.badge-dot { width:5px; height:5px; border-radius:50%; }
.badge.table .badge-dot { background:var(–accent); }
.badge.group .badge-dot { background:var(–accent2); }
.qc-prompt { font-size:13px; color:var(–text); opacity:.75; margin-top:14px; }

/* ── Options ── */
.options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
@media(max-width:520px){
.options{grid-template-columns:1fr;}
.q-card{padding:22px 18px 20px;}
.stats-bar{gap:12px;padding:10px 16px;}
}
.opt-btn {
padding:14px 16px; background:var(–surface); border:1px solid var(–border);
border-radius:12px; color:var(–text); font-family:‘Noto Sans JP’,sans-serif;
font-size:14px; cursor:pointer; text-align:left; transition:all .16s; line-height:1.4;
font-family: ‘Courier New’, monospace;
}
.opt-btn:hover:not(:disabled) { border-color:var(–accent); background:#1f2130; transform:translateY(-1px); }
.opt-btn.correct-ans { background:rgba(93,214,140,.12); border-color:var(–correct); color:var(–correct); }
.opt-btn.wrong-ans   { background:rgba(232,122,122,.10); border-color:var(–wrong);   color:var(–wrong); }
.opt-btn:disabled { cursor:default; transform:none; opacity:.65; }
.opt-btn.correct-ans:disabled,.opt-btn.wrong-ans:disabled { opacity:1; }

/* ── Feedback ── */
.feedback {
padding:14px 18px; border-radius:12px; font-size:13px; line-height:1.7;
display:none; animation:fadeIn .25s ease; margin-bottom:14px;
}
.feedback.show { display:block; }
.feedback.ok { background:rgba(93,214,140,.10); border:1px solid rgba(93,214,140,.3); }
.feedback.ng { background:rgba(232,122,122,.10); border:1px solid rgba(232,122,122,.3); }
.fb-head { font-size:15px; font-weight:700; margin-bottom:8px; }
.feedback.ok .fb-head { color:var(–correct); }
.feedback.ng .fb-head { color:var(–wrong); }
.fb-correct-form {
font-family:‘Courier New’,monospace; font-size:15px;
color:var(–accent); margin-bottom:8px; padding:8px 12px;
background:rgba(232,201,122,.07); border-radius:6px; display:inline-block;
}
.fb-rows { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
.fb-row { font-size:13px; color:#d4d2cc; line-height:1.5; }
.fb-row strong { color:var(–accent2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-right:8px; font-weight:700; }
.fb-example {
margin-top:10px; padding:10px 14px;
background:rgba(122,184,232,0.08); border-left:3px solid var(–accent2);
border-radius:0 8px 8px 0;
}
.fb-example-label { font-size:10px; color:var(–accent2); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:5px; }
.fb-example-en { font-family:‘Courier New’,monospace; font-size:13px; color:#c8e4f5; line-height:1.6; }
.fb-example-ja { font-size:12px; color:#a0b8c8; margin-top:4px; line-height:1.5; }

/* ── Next ── */
.next-btn {
display:none; width:100%; padding:15px;
background:var(–accent); color:#0e0f14; border:none; border-radius:14px;
font-family:‘Noto Sans JP’,sans-serif; font-size:15px; font-weight:700;
cursor:pointer; transition:all .2s; letter-spacing:.04em; margin-bottom:20px;
}
.next-btn:hover { background:#f0d890; transform:translateY(-1px); }
.next-btn.show { display:block; animation:fadeIn .3s ease; }

/* ── Results ── */
#result-screen { display:none; text-align:center; padding:40px 20px; animation:fadeIn .5s ease; }
#result-screen.show { display:block; }
.result-score { font-family:‘Playfair Display’,serif; font-size:76px; color:var(–accent); line-height:1; margin:18px 0 6px; }
.result-label { font-size:16px; color:var(–text); margin-bottom:8px; }
.result-detail { display:flex; gap:28px; justify-content:center; margin:14px 0 26px; }
.rd-item { text-align:center; }
.rd-val { font-size:28px; font-weight:700; font-family:‘Playfair Display’,serif; }
.rd-lbl { font-size:11px; color:var(–muted); }
.result-msg { font-size:13px; color:var(–muted); margin-bottom:30px; line-height:1.8; }
.retry-btn {
padding:14px 40px; background:var(–accent); color:#0e0f14; border:none;
border-radius:12px; font-family:‘Noto Sans JP’,sans-serif; font-size:14px; font-weight:700;
cursor:pointer; transition:all .2s; margin:0 6px;
}
.retry-btn:hover { background:#f0d890; }
.retry-btn.sec { background:transparent; color:var(–accent); border:1px solid var(–accent); }
.retry-btn.sec:hover { background:rgba(232,201,122,.1); }

#quiz-screen { display:none; }
#quiz-screen.show { display:block; }

@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.card-in { animation:fadeIn .35s ease; }
</style>

</head>
<body>

<header>
  <div class="title">Verb Pattern Quiz</div>
  <div class="subtitle">英語動詞文型マスター — 用法パターン選択</div>
</header>
<div class="progress-wrap"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>

<main>

<!-- SETUP -->

<div id="setup-screen">
  <h2>出題設定</h2>
  <div class="setup-section">
    <div class="setup-label">カテゴリー選択</div>
    <div class="cat-filter" id="catFilter"></div>
  </div>
  <div class="divider"></div>
  <div class="setup-section">
    <div class="setup-label">出題数</div>
    <div class="q-count-row">
      <select id="qCount">
        <option value="10">10問</option>
        <option value="20" selected>20問</option>
        <option value="30">30問</option>
        <option value="all">全問</option>
      </select>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:10px;">
      動詞の正しい用法構文を4択から選んでください<br>
      ダミーの選択肢も同じ動詞で異なるパターンが示されます
    </p>
  </div>
  <button class="start-btn" onclick="startQuiz()">スタート ▶</button>
</div>

<!-- QUIZ -->

<div id="quiz-screen">
  <div class="stats-bar">
    <div class="stat-item"><span class="stat-val n" id="statQ">0</span><span class="stat-label">問目</span></div>
    <div class="stat-item"><span class="stat-val c" id="statC">0</span><span class="stat-label">正解</span></div>
    <div class="stat-item"><span class="stat-val w" id="statW">0</span><span class="stat-label">不正解</span></div>
    <div class="stat-item"><span class="stat-val n" id="statR">—</span><span class="stat-label">正答率</span></div>
  </div>

  <div class="q-card card-in" id="qCard">
    <div class="qc-top">
      <div class="qc-verb" id="qVerb">—</div>
      <div class="qc-num" id="qNum">1 / 20</div>
    </div>
    <div class="qc-badges">
      <span class="badge table"><span class="badge-dot"></span><span id="badgeTable">—</span></span>
      <span class="badge group"><span class="badge-dot"></span><span id="badgeGroup">—</span></span>
    </div>
    <div class="qc-prompt">この動詞の正しい用法構文を選んでください</div>
  </div>

  <div class="options" id="optsGrid"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQ()">次の問題 →</button>
</div>

<!-- RESULTS -->

<div id="result-screen">
  <div style="font-size:44px;margin-bottom:4px">🎓</div>
  <div class="result-score" id="resScore">—</div>
  <div class="result-label" id="resLabel">お疲れ様でした！</div>
  <div class="result-detail">
    <div class="rd-item"><div class="rd-val" id="rdC" style="color:var(--correct)">0</div><div class="rd-lbl">正解</div></div>
    <div class="rd-item"><div class="rd-val" id="rdW" style="color:var(--wrong)">0</div><div class="rd-lbl">不正解</div></div>
    <div class="rd-item"><div class="rd-val" id="rdT" style="color:var(--accent)">0</div><div class="rd-lbl">総問数</div></div>
  </div>
  <div class="result-msg" id="resMsg"></div>
  <button class="retry-btn" onclick="showSetup()">設定に戻る</button>
  <button class="retry-btn sec" onclick="retryQuiz()">もう一度</button>
</div>

</main>
<script>
// ═══════════════════════════════════════════════════════
// DATA
// correctForm  : 正解となる具体的な構文（動詞を当てはめたもの）
// wrongForms   : 同じ動詞を使った誤りパターン3つ（他の用法や文型の混在）
// meaning      : 日本語の意味（フィードバック解説に使用）
// usageLabel   : テキスト上の分類ラベル
// usageGroup   : 大文型
// table        : 動詞表番号
// ═══════════════════════════════════════════════════════
const DATA = [

// ════════════════════════════════
// 動詞表1  S+V+O₁+O₂
// ════════════════════════════════

// (1) give O₁O₂ = give O₂ to O₁ 型
{ verb:“allow”,    correctForm:“allow O₁ O₂  (= allow O₂ to O₁)”,    wrongForms:[“allow O to do”,“allow O as C”,“allow O (to be) C”],            meaning:“O₁にO₂を与える”,            usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“The judge allowed him a final statement.”, exampleJa:“裁判官は彼に最終陳述の機会を与えた。” },
{ verb:“bring”,    correctForm:“bring O₁ O₂  (= bring O₂ to O₁)”,    wrongForms:[“bring O to do”,“bring O as C”,“bring O (to be) C”],            meaning:“O₁にO₂をもたらす”,          usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“His arrival brought us great joy.”, exampleJa:“彼の到着は私たちに大きな喜びをもたらした。” },
{ verb:“deny”,     correctForm:“deny O₁ O₂  (= deny O₂ to O₁)”,      wrongForms:[“deny O to do”,“deny O as C”,“deny O C”],                       meaning:“O₁にO₂を与えない”,          usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“They denied him access to the building.”, exampleJa:“彼らは彼に建物への入場を拒否した。” },
{ verb:“do”,       correctForm:“do O₁ O₂  (= do O₂ to O₁)”,          wrongForms:[“do O to do”,“do O as C”,“do O C”],                             meaning:“O₁にO₂をもたらす／与える”,  usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“Exercise will do you a lot of good.”, exampleJa:“運動はあなたに大きな恩恵をもたらすだろう。” },
{ verb:“hand”,     correctForm:“hand O₁ O₂  (= hand O₂ to O₁)”,      wrongForms:[“hand O to do”,“hand O as C”,“hand O C”],                       meaning:“O₁にO₂を手渡す”,            usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“She handed him the envelope.”, exampleJa:“彼女は彼に封筒を手渡した。” },
{ verb:“lend”,     correctForm:“lend O₁ O₂  (= lend O₂ to O₁)”,      wrongForms:[“lend O to do”,“lend O as C”,“lend O C”],                       meaning:“O₁にO₂を貸す”,              usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“Could you lend me your dictionary?”, exampleJa:“辞書を貸していただけますか？” },
{ verb:“offer”,    correctForm:“offer O₁ O₂  (= offer O₂ to O₁)”,    wrongForms:[“offer O to do”,“offer O as C”,“offer O C”],                    meaning:“O₁にO₂を申し出る”,          usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“They offered him a higher salary.”, exampleJa:“彼らは彼により高い給料を提示した。” },
{ verb:“owe”,      correctForm:“owe O₁ O₂  (= owe O₂ to O₁)”,        wrongForms:[“owe O to do”,“owe O as C”,“owe O C”],                          meaning:“O₁にO₂を借りる／負う”,      usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“I owe you an apology.”, exampleJa:“あなたに謝罪しなければなりません。” },
{ verb:“pass”,     correctForm:“pass O₁ O₂  (= pass O₂ to O₁)”,      wrongForms:[“pass O to do”,“pass O as C”,“pass O C”],                       meaning:“O₁にO₂を手渡す／回す”,      usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“Please pass me the salt.”, exampleJa:“塩を回してください。” },
{ verb:“pay”,      correctForm:“pay O₁ O₂  (= pay O₂ to O₁)”,        wrongForms:[“pay O to do”,“pay O as C”,“pay O C”],                          meaning:“O₁にO₂を払う”,              usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“The company paid him a bonus.”, exampleJa:“会社は彼にボーナスを支払った。” },
{ verb:“promise”,  correctForm:“promise O₁ O₂  (= promise O₂ to O₁)”, wrongForms:[“promise O to do”,“promise O as C”,“promise O C”],             meaning:“O₁にO₂を約束する”,          usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“He promised her a diamond ring.”, exampleJa:“彼は彼女にダイヤの指輪を約束した。” },
{ verb:“read”,     correctForm:“read O₁ O₂  (= read O₂ to O₁)”,      wrongForms:[“read O to do”,“read O as C”,“read O C”],                       meaning:“O₁にO₂を読んで聞かせる”,    usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“She read the children a bedtime story.”, exampleJa:“彼女は子供たちに寝る前の話を読み聞かせた。” },
{ verb:“sell”,     correctForm:“sell O₁ O₂  (= sell O₂ to O₁)”,      wrongForms:[“sell O to do”,“sell O as C”,“sell O C”],                       meaning:“O₁にO₂を売る”,              usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“He sold me his old car for a low price.”, exampleJa:“彼は私に古い車を安く売ってくれた。” },
{ verb:“send”,     correctForm:“send O₁ O₂  (= send O₂ to O₁)”,      wrongForms:[“send O to do”,“send O as C”,“send O C”],                       meaning:“O₁にO₂を送る”,              usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“She sent him a long letter.”, exampleJa:“彼女は彼に長い手紙を送った。” },
{ verb:“show”,     correctForm:“show O₁ O₂  (= show O₂ to O₁)”,      wrongForms:[“show O to do”,“show O as C”,“show O (to be) C”],               meaning:“O₁にO₂を見せる／教える”,    usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“Can you show me the way to the station?”, exampleJa:“駅への道を教えていただけますか？” },
{ verb:“take”,     correctForm:“take O₁ O₂  (= take O₂ to O₁)”,      wrongForms:[“take O₁ O₂  (= take O₂ for O₁)”,“take O to do”,“take O C”],  meaning:“O₁にO₂を持っていく”,        usageLabel:“give O₁O₂ = give O₂ to O₁ 型”, usageGroup:“S+V+O₁+O₂”, table:“動詞表1”,
exampleEn:“He took her some flowers.”, exampleJa:“彼は彼女に花を持っていった。” },

const ALL_TABLES = […new Set(DATA.map(d => d.table))];

// ═══════════════ STATE ═══════════════
let selectedTables = new Set(ALL_TABLES);
let qList = [];
let qIdx = 0;
let correct = 0;
let wrong = 0;
let answered = false;

// ═══════════════ SETUP ═══════════════
function buildCatFilter() {
const cf = document.getElementById(‘catFilter’);
ALL_TABLES.forEach(t => {
const btn = document.createElement(‘button’);
btn.className = ‘cat-tag on’;
btn.textContent = t;
btn.onclick = () => {
if (selectedTables.has(t)) {
if (selectedTables.size <= 1) return;
selectedTables.delete(t); btn.classList.remove(‘on’);
} else {
selectedTables.add(t); btn.classList.add(‘on’);
}
};
cf.appendChild(btn);
});
}

function shuffle(a) {
for (let i = a.length - 1; i > 0; i–) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}

function startQuiz() {
const pool = DATA.filter(d => selectedTables.has(d.table));
if (pool.length < 4) { alert(‘カテゴリーをもっと選んでください’); return; }
const sel = document.getElementById(‘qCount’).value;
const sh = shuffle([…pool]);
const n = sel === ‘all’ ? sh.length : Math.min(parseInt(sel), sh.length);
qList = sh.slice(0, n);
qIdx = 0; correct = 0; wrong = 0; answered = false;

document.getElementById(‘setup-screen’).style.display = ‘none’;
document.getElementById(‘result-screen’).classList.remove(‘show’);
document.getElementById(‘quiz-screen’).classList.add(‘show’);
renderQ();
}

// ═══════════════ RENDER ═══════════════
function renderQ() {
if (qIdx >= qList.length) { showResults(); return; }
answered = false;
const q = qList[qIdx];

document.getElementById(‘progressBar’).style.width = (qIdx / qList.length * 100) + ‘%’;
document.getElementById(‘statQ’).textContent = qIdx + 1;
document.getElementById(‘statC’).textContent = correct;
document.getElementById(‘statW’).textContent = wrong;
document.getElementById(‘statR’).textContent = qIdx === 0 ? ‘—’ : Math.round(correct / qIdx * 100) + ‘%’;

document.getElementById(‘qVerb’).textContent = q.verb;
document.getElementById(‘qNum’).textContent = `${qIdx + 1} / ${qList.length}`;
document.getElementById(‘badgeTable’).textContent = q.table;
document.getElementById(‘badgeGroup’).textContent = q.usageGroup;

document.getElementById(‘qCard’).classList.remove(‘card-in’);
void document.getElementById(‘qCard’).offsetWidth;
document.getElementById(‘qCard’).classList.add(‘card-in’);

const fb = document.getElementById(‘feedback’);
fb.className = ‘feedback’; fb.innerHTML = ‘’;
document.getElementById(‘nextBtn’).classList.remove(‘show’);

// Build 4 options: correctForm + 3 wrongForms (shuffled)
const opts = shuffle([q.correctForm, …q.wrongForms]);
const grid = document.getElementById(‘optsGrid’);
grid.innerHTML = ‘’;
opts.forEach(opt => {
const btn = document.createElement(‘button’);
btn.className = ‘opt-btn’;
btn.textContent = opt;
btn.onclick = () => answer(btn, opt, q);
grid.appendChild(btn);
});
}

function answer(btn, chosen, q) {
if (answered) return;
answered = true;

document.querySelectorAll(’.opt-btn’).forEach(b => {
b.disabled = true;
if (b.textContent === q.correctForm) b.classList.add(‘correct-ans’);
});

const fb = document.getElementById(‘feedback’);
const isOk = chosen === q.correctForm;
if (isOk) { correct++; btn.classList.add(‘correct-ans’); }
else       { wrong++;   btn.classList.add(‘wrong-ans’); }

document.getElementById(‘statC’).textContent = correct;
document.getElementById(‘statW’).textContent = wrong;
document.getElementById(‘statR’).textContent = Math.round(correct / (qIdx + 1) * 100) + ‘%’;

fb.className = `feedback ${isOk ? 'ok' : 'ng'} show`;
const H = (s) => s; // helper
fb.innerHTML = [
`\x3cdiv class="fb-head">${isOk ? '✓ 正解！' : '✗ 不正解'}\x3c/div>`,
`\x3cdiv class="fb-correct-form">${q.correctForm}\x3c/div>`,
`\x3cdiv class="fb-rows">`,
`\x3cdiv class="fb-row">\x3cstrong>意味\x3c/strong>${q.meaning}\x3c/div>`,
`\x3cdiv class="fb-row">\x3cstrong>用法\x3c/strong>${q.usageLabel}\x3c/div>`,
`\x3cdiv class="fb-row">\x3cstrong>文型\x3c/strong>${q.usageGroup}（${q.table}）\x3c/div>`,
`\x3c/div>`,
`\x3cdiv class="fb-example">`,
`\x3cdiv class="fb-example-label">例文\x3c/div>`,
`\x3cdiv class="fb-example-en">${q.exampleEn}\x3c/div>`,
`\x3cdiv class="fb-example-ja">${q.exampleJa}\x3c/div>`,
`\x3c/div>`,
].join(’’);

document.getElementById(‘nextBtn’).classList.add(‘show’);
}

function nextQ() { qIdx++; renderQ(); }

// ═══════════════ RESULTS ═══════════════
function showResults() {
document.getElementById(‘quiz-screen’).classList.remove(‘show’);
document.getElementById(‘progressBar’).style.width = ‘100%’;
const total = qList.length;
const pct = Math.round(correct / total * 100);
document.getElementById(‘resScore’).textContent = pct + ‘%’;
document.getElementById(‘resLabel’).textContent = `${total}問中 ${correct}問正解`;
document.getElementById(‘rdC’).textContent = correct;
document.getElementById(‘rdW’).textContent = wrong;
document.getElementById(‘rdT’).textContent = total;
const msgs = [
‘💪 基礎から整理しましょう。カテゴリーを絞って繰り返すのが効果的です。’,
‘📚 半分以上正解！用法パターンの細部を意識して復習しましょう。’,
‘👍 よくできました！to/for の区別や to be の有無などを確認しましょう。’,
‘🏆 ほぼ完璧！自信を持ってください。’
];
document.getElementById(‘resMsg’).textContent = msgs[pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 55 ? 1 : 0];
document.getElementById(‘result-screen’).classList.add(‘show’);
}

function showSetup() {
document.getElementById(‘result-screen’).classList.remove(‘show’);
document.getElementById(‘quiz-screen’).classList.remove(‘show’);
document.getElementById(‘setup-screen’).style.display = ‘block’;
}
function retryQuiz() { document.getElementById(‘result-screen’).classList.remove(‘show’); startQuiz(); }

buildCatFilter();
</script>
